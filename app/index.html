<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' file: data: blob:; media-src 'self' file: data:">
<title>NexusOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen desktop, floating glass taskbar centred at the bottom, windows float above a generative wallpaper */
:root{
  --bg:#0c1417; --surface:rgba(22,32,36,.82); --surface-solid:#162024; --raised:rgba(255,255,255,.06);
  --line:rgba(190,225,220,.14); --fg:#e8f1ef; --muted:#93a8a4; --accent:#3fd0b4; --accent-fg:#06221c;
  --danger:#ff6b5e; --shadow:0 24px 60px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root.light{
  --bg:#e6eeec; --surface:rgba(250,253,252,.84); --surface-solid:#f7fbfa; --raised:rgba(10,40,36,.05);
  --line:rgba(20,60,55,.14); --fg:#12211f; --muted:#56706b; --accent-fg:#ffffff; color-scheme:light;
  --shadow:0 24px 60px rgba(20,50,45,.22),0 2px 8px rgba(20,50,45,.12);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;user-select:none;-webkit-user-select:none}
#wall{position:fixed;inset:0;width:100%;height:100%;display:block}
#desk{position:fixed;inset:0;padding:16px;display:grid;grid-template-rows:repeat(auto-fill,92px);grid-auto-flow:column;grid-auto-columns:88px;gap:6px;align-content:start;bottom:72px}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;border:1px solid transparent;background:none;color:#fff;font:500 12px var(--body);text-shadow:0 1px 3px rgba(0,0,0,.7);cursor:default}
.icon:hover{background:rgba(255,255,255,.1)} .icon:focus-visible{outline:2px solid var(--accent);background:rgba(255,255,255,.14)}
.glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.glyph svg{width:26px;height:26px}
/* taskbar */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px;background:var(--surface);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);z-index:9000;max-width:calc(100% - 20px)}
#apps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tb{position:relative;width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.tb:hover,.tb.on{background:var(--raised)} .tb:focus-visible{outline:2px solid var(--accent)}
.tb .glyph{width:32px;height:32px;border-radius:9px} .tb .glyph svg{width:19px;height:19px}
.tb.run::after{content:"";position:absolute;bottom:2px;width:5px;height:3px;border-radius:2px;background:var(--muted);transition:width .2s}
.tb.run.on::after{width:16px;background:var(--accent)}
#startBtn .mark{width:30px;height:30px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
#tray{display:flex;align-items:center;gap:10px;padding:0 10px 0 6px;font-variant-numeric:tabular-nums;color:var(--fg);flex:none;cursor:pointer;border-radius:12px;height:44px;border:0;background:none;font-family:var(--body)}
#tray:hover{background:var(--raised)}
#clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
#clock b{font:600 13px var(--body)} #clock span{font-size:11px;color:var(--muted)}
/* panels */
.panel{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:9001;opacity:0;pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1.2)}
.panel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#start{width:min(560px,calc(100vw - 20px));padding:20px;display:flex;flex-direction:column;gap:16px}
#search{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--fg);font:15px var(--body);outline:none}
#search:focus{border-color:var(--accent)}
.sw{position:relative} .sw svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--muted)}
.h{font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
#grid .icon{color:var(--fg);text-shadow:none}
#grid .icon:hover{background:var(--raised)}
.foot{position:relative;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.me{display:flex;align-items:center;gap:10px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 13px var(--display)}
.ibtn{border:0;background:none;color:var(--fg);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--raised)} .ibtn svg{width:18px;height:18px}
#quick{left:auto;right:10px;transform:translateY(12px);width:min(340px,calc(100vw - 20px));padding:18px;display:flex;flex-direction:column;gap:14px}
#quick.open{transform:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:12px;padding:12px 8px;font:500 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.tile svg{width:18px;height:18px} .tile{overflow-wrap:anywhere;text-align:center} .tile.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.slider{display:flex;align-items:center;gap:10px} .slider svg{width:18px;height:18px;color:var(--muted);flex:none}
input[type=range]{flex:1;accent-color:var(--accent)}
.cal{font-variant-numeric:tabular-nums}
.cal .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px} .cal .ch b{font:600 15px var(--display)}
.cal table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}
.cal th{color:var(--muted);font-weight:500;padding:4px 0} .cal td{padding:5px 0;border-radius:8px}
.cal td.t{background:var(--accent);color:var(--accent-fg);font-weight:600} .cal td.x{color:var(--muted);opacity:.5}
/* windows */
.win{position:fixed;min-width:280px;min-height:180px;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.win.min{display:none} .win.max{inset:0 0 72px 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.blur .tbar{opacity:.72}
.tbar{display:flex;align-items:center;gap:10px;height:40px;padding-left:12px;flex:none;cursor:default;touch-action:none}
.tbar .glyph{width:20px;height:20px;border-radius:6px} .tbar .glyph svg{width:13px;height:13px}
.tbar .t{flex:1;font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;height:100%}
.ctl button{width:44px;height:100%;border:0;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ctl button:hover{background:var(--raised)} .ctl button.x:hover{background:var(--danger);color:#fff}
.ctl svg{width:12px;height:12px}
.body{flex:1;min-height:0;overflow:auto;position:relative;user-select:text;-webkit-user-select:text}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none}
/* app styles */
textarea.note{width:100%;height:100%;border:0;resize:none;padding:16px 20px;background:transparent;color:var(--fg);font:15px/1.6 var(--body);outline:none}
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:8px;user-select:none}
.calc .disp{text-align:right;padding:8px 6px;font-variant-numeric:tabular-nums}
.calc .disp small{display:block;color:var(--muted);min-height:18px;font-size:13px}
.calc .disp div{font:600 36px var(--display);overflow:hidden;text-overflow:ellipsis}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{border:0;border-radius:10px;background:var(--raised);color:var(--fg);font:500 17px var(--body);cursor:pointer;min-height:40px}
.keys button:hover{filter:brightness(1.25)} .keys .op{color:var(--accent)} .keys .eq{background:var(--accent);color:var(--accent-fg)}
.files{display:grid;grid-template-columns:160px 1fr;height:100%}
.files nav{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.devs{display:contents} .files nav button small{color:var(--muted);font-size:11px} .files nav button{text-align:left;border:0;background:none;color:var(--fg);padding:8px 10px;border-radius:8px;font:14px var(--body);cursor:pointer}
.files nav button.on,.files nav button:hover{background:var(--raised)}
.files ul{list-style:none;margin:0;padding:8px}
.files .main>ul{flex:1 0 auto}
.files li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:default}
.files li:hover{background:var(--raised)} .files li small{color:var(--muted);font-variant-numeric:tabular-nums}
.files .fi{width:24px;height:24px}
.term{background:#071012;color:#bdf3e6;font:13px/1.55 var(--mono);padding:12px 14px;min-height:100%;white-space:pre-wrap;word-break:break-word}
.term input{background:none;border:0;outline:none;color:inherit;font:inherit;width:70%}
.term .p{color:var(--accent)}
.paint{display:flex;flex-direction:column;height:100%}
.ptools{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.sw8{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw8.on{border-color:var(--fg)}
.paint canvas{flex:1;min-height:0;background:#fff;touch-action:none;cursor:crosshair}
.pbtn{border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:8px;padding:5px 10px;font:13px var(--body);cursor:pointer}
.set{padding:20px;display:flex;flex-direction:column;gap:22px}
.set .row{display:flex;gap:10px;flex-wrap:wrap}
.acc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.acc.on{border-color:var(--fg)}
.wp{width:110px;height:68px;border-radius:10px;border:2px solid transparent;cursor:pointer;background-size:cover}
.wp.on{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--fg);padding:8px 16px;font:14px var(--body);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.about{padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.about h1{font:700 30px var(--display);margin:0;letter-spacing:-.02em}
.about p{margin:0;color:var(--muted);line-height:1.55;max-width:48ch}
.about dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:8px 0 0;font-variant-numeric:tabular-nums}
.about dt{color:var(--muted)}
.mine{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;user-select:none}
.mine .st{display:flex;gap:16px;align-items:center;font:600 14px var(--mono)}
.mgrid{display:grid;grid-template-columns:repeat(9,28px);gap:2px}
.mgrid button{width:28px;height:28px;border:0;border-radius:5px;background:var(--raised);color:var(--fg);font:700 13px var(--mono);cursor:pointer;padding:0}
.mgrid button.o{background:transparent;cursor:default}
.mgrid button.b{background:var(--danger);color:#fff}
/* browser */
.brw{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none;flex:none}
.tab{display:flex;align-items:center;gap:6px;max-width:200px;min-width:0;padding:7px 8px 7px 12px;border-radius:9px 9px 0 0;background:transparent;border:0;color:var(--muted);font:13px var(--body);cursor:pointer;flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.tab.on{background:var(--raised);color:var(--fg)}
.tab i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:14px;line-height:1}
.tab i:hover{background:var(--line)}
.navr{display:flex;gap:4px;align-items:center;padding:6px 8px;background:var(--raised);flex:none}
.navr .ibtn{width:32px;height:32px}
.navr input{flex:1;min-width:0;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-solid);color:var(--fg);font:14px var(--body);outline:none}
.navr input:focus{border-color:var(--accent)}
.views{flex:1;position:relative;min-height:0;background:#fff}
.views webview{position:absolute;inset:0;width:100%;height:100%}
.views webview.hide{visibility:hidden}
.prog{height:2px;background:var(--accent);width:0;transition:width .3s;flex:none}
.pathbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.pathbar b{color:var(--fg);font-weight:500}
.files .main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.files nav .h{padding:10px 10px 4px}
.notebar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--raised);overflow:hidden;margin-top:4px;width:220px;max-width:100%}
.meter div{height:100%;background:var(--accent)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.toggle small{display:block;color:var(--muted);margin-top:2px}
.sw-t{width:42px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw-t.on{background:var(--accent)} .sw-t.on::after{left:21px}
.pmenu{position:absolute;right:20px;bottom:64px;background:var(--surface-solid);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:170px}
.pmenu button{border:0;background:none;color:var(--fg);text-align:left;padding:9px 12px;border-radius:8px;font:14px var(--body);cursor:pointer}
.pmenu button:hover{background:var(--raised)}
body.dragging webview{pointer-events:none}
.fileacts{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:41px}
.files li{outline:none}
.files li.sel{background:var(--raise);box-shadow:inset 0 0 0 1px var(--accent)}
.files li.empty{color:var(--muted);cursor:default;display:block}
.files li input.ren{background:var(--surface-solid);border:1px solid var(--accent);border-radius:6px;color:var(--fg);font:14px var(--body);padding:3px 6px;min-width:0}
.pbtn.danger{color:var(--danger)}
.pbtn:disabled{opacity:.45;cursor:default}
.nstat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nname{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--fg);font:13px var(--body);width:190px;min-width:0}
.nname:focus{border-color:var(--accent);outline:none}
.icon .fglyph{background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.icon .fglyph .fi{width:30px;height:30px}.icon .fglyph .fi svg{width:30px;height:30px}
.icon .dname{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dls{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:9500;width:min(340px,calc(100vw - 32px))}
.dlcard{background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;transition:opacity .3s,transform .3s}
.dlcard.out{opacity:0;transform:translateX(20px)}
.dlcard b{font:600 13px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlcard small{color:var(--muted);font-size:12px}
.dlcard .bar2{height:5px;border-radius:3px;background:var(--raise);overflow:hidden}.dlcard .bar2 div{height:100%;background:var(--accent);transition:width .2s}
.dlcard .row2{display:flex;gap:6px}
/* boot */
#boot{position:fixed;inset:0;background:#070d0f;z-index:99999;display:grid;place-items:center;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
#boot .in{display:flex;flex-direction:column;align-items:center;gap:22px;color:#e8f1ef}
#boot .mark{width:72px;height:72px}
#boot h2{font:600 22px var(--display);margin:0;letter-spacing:.02em}
.ring{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:#3fd0b4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);z-index:9999;max-width:300px;transition:opacity .3s,transform .3s}
.toast b{font-family:var(--display);display:block;margin-bottom:2px} .toast span{color:var(--muted);font-size:13px}
.toast.out{opacity:0;transform:translateX(20px)}
@media (max-width:640px){
  .win{inset:0 0 72px 0!important;width:auto!important;height:auto!important;border-radius:0}
  .rs{display:none}
  .files{grid-template-columns:1fr} .files nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  #tray #clock span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 1.3: dialogs, settings, app store */
.ask{position:fixed;inset:0;z-index:2000000000;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.askbox{background:var(--surface-solid);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 14px;width:min(420px,100%);display:flex;flex-direction:column;gap:8px}
.askbox b{font-size:16px} .askbox p{margin:0 0 6px;color:var(--muted);line-height:1.45;user-select:text}
.askbox .row2{display:flex;gap:8px;justify-content:flex-end}
.pbtn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pbtn.danger-fill{background:var(--danger);color:#fff;border-color:transparent}
.row2{display:flex;gap:6px;align-items:center} .row2.wrap{flex-wrap:wrap}
.settings{display:grid;grid-template-columns:190px 1fr;height:100%;min-height:0}
.snav{display:flex;flex-direction:column;gap:2px;padding:10px;border-right:1px solid var(--line);overflow-y:auto}
.snav button{border:0;background:none;color:var(--fg);text-align:left;padding:8px 10px;border-radius:8px;font:14px var(--body);cursor:pointer}
.snav button:hover{background:var(--raised)} .snav button.on{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.spane{overflow-y:auto;min-width:0}
.spage{padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px;max-width:640px}
.spage .row{display:flex;gap:10px;flex-wrap:wrap}
.sset{display:flex;flex-direction:column;gap:8px}
.sset h3{margin:0;font:600 15px var(--body);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.srow .sl{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px} .srow .sl small{color:var(--muted);overflow-wrap:anywhere}
.srow input[type=range]{width:180px;accent-color:var(--accent)}

.serr{color:var(--danger);font-size:13px;overflow-wrap:anywhere}

.secitem{display:flex;gap:10px;align-items:flex-start;padding:8px 2px}

.secitem.ok .dot{background:#3fbf7f} .secitem.warn .dot{background:#f0b451} .secitem small{display:block;color:var(--muted);margin-top:2px}

@media (max-width:640px){.settings{grid-template-columns:1fr;grid-template-rows:auto 1fr}.snav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.snav button{white-space:nowrap}}
/* ===== NexusOS look: dark, sharp, neon ===== */
:root{--bg:#06080c;--surface:rgba(10,13,19,.88);--surface-solid:#0c1017;--raised:rgba(140,200,255,.06);--line:rgba(120,200,255,.15);--fg:#e8f3ff;--muted:#8796ab;--accent:#00e5ff;--accent-fg:#00161b;--danger:#ff3b5c;
  --shadow:0 24px 60px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);--display:"Rajdhani","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif;
  --glow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),0 0 26px color-mix(in srgb,var(--accent) 20%,transparent)}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,200,255,.18);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent) 55%,transparent);background-clip:padding-box;border:2px solid transparent}
.win{border-radius:8px}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 0%,transparent) 75%);z-index:2;pointer-events:none}
.win:not(.blur){box-shadow:var(--shadow),var(--glow)}
.win.blur::before{opacity:.25}
.tbar .t{font:600 15px var(--display);letter-spacing:.04em}
#bar{border-radius:10px;box-shadow:var(--shadow),inset 0 -2px 0 color-mix(in srgb,var(--accent) 60%,transparent)}
.tb{border-radius:7px} .tb .glyph{border-radius:7px}
.tb.run.on::after{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.glyph{border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -10px 18px rgba(0,0,0,.18)}
.panel{border-radius:10px}
.panel .h{font:600 13px var(--display);letter-spacing:.14em;text-transform:uppercase}
#search{border-radius:6px} #search:focus{border-color:var(--accent);box-shadow:var(--glow)}
.tile{border-radius:7px} .tile.on{box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
#clock b{font:700 16px var(--display);letter-spacing:.05em}
.pbtn,.txt{border-radius:6px} .pbtn:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pbtn.pri{box-shadow:0 0 14px color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
.pbtn.pri:hover{filter:brightness(1.1)}
.sw-t.on{box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.meter div{background:linear-gradient(90deg,var(--accent),#ff2e88)}
.sset h3,.ashead h2,.about h1{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.sset h3{font-size:16px}
.srow,.sitem,.ascard,.toggle{border-radius:7px}
.ascard:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.snav button{border-radius:6px} .snav button.on{box-shadow:inset 3px 0 0 var(--accent),0 0 18px color-mix(in srgb,var(--accent) 12%,transparent)}
.toast,.dlcard{border-radius:8px;border-left:3px solid var(--accent)}
.askbox{border-radius:10px;box-shadow:var(--shadow),var(--glow)} .askbox b{font:700 19px var(--display);letter-spacing:.04em}
#boot{background:#05060a} #boot h2{font:700 30px var(--display);letter-spacing:.3em;text-transform:uppercase;padding-left:.3em;background:linear-gradient(90deg,#00e5ff,#ff2e88);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .mark{filter:drop-shadow(0 0 18px rgba(0,229,255,.55))}
.mark{filter:drop-shadow(0 0 6px rgba(0,229,255,.35))}
.acc{border-radius:6px}
.wp{border-radius:6px}
:root.light{--accent:#0095b3}

/* ===== 1.4.3: NexusOS as separate windows ===== */
.view-panel #wall,.view-panel #desk,.view-panel .panel,.view-popup #wall,.view-popup #desk,.view-popup #bar,.view-toasts #wall,.view-toasts #desk,.view-toasts #bar,.view-toasts .panel,
.view-app #wall,.view-app #desk,.view-app #bar,.view-app .panel,.view-desktop #bar,.view-desktop .panel{display:none!important}
.view-panel body{background:#080b11}
.view-panel #bar{position:fixed;inset:0;transform:none;border-radius:0;justify-content:center;padding:0 10px;gap:6px;background:linear-gradient(180deg,#0c1119,#070a10);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 55%,transparent);border:0;backdrop-filter:none}
.view-panel #bar>.sep:first-of-type{display:none}
.view-panel #tray{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.view-panel #tray.on,.view-panel #startBtn.on{background:var(--raised)}
.view-panel #apps{max-width:calc(100vw - 420px)}
.view-panel .tb.many::before{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
#showdesk{position:absolute;right:0;top:0;bottom:0;width:8px;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer}
#showdesk:hover{background:var(--raised)}
.view-popup body{background:var(--surface-solid)}
.view-popup .panel{position:fixed;inset:0;width:auto!important;transform:none!important;opacity:1!important;pointer-events:auto!important;border-radius:0;display:none!important;backdrop-filter:none;background:linear-gradient(180deg,#0d121b,#080b11);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:none;overflow:auto}
.view-popup .panel.open{display:flex!important}
.view-popup #grid{flex:1;align-content:start;overflow:auto}
.view-toasts body{background:#080b11;overflow:hidden}
#toastbox{display:flex;flex-direction:column;gap:8px;padding:0}
.view-toasts .toast{position:static!important;max-width:none;box-shadow:none;margin:0;background:#0c1119;transition:opacity .25s}
.view-toasts #dls{position:static;width:auto}
.view-toasts .dlcard{background:#0c1119;box-shadow:none}
.view-app body{background:var(--surface-solid)}
.view-app .appbody{position:fixed;inset:0;display:flex;flex-direction:column}
.view-app .appbody>*{flex:1;min-height:0}
/* desktop icons you can move */
#desk.free{display:block;padding:0}
#desk.free .dicon{position:absolute;width:88px;padding:8px 4px}
.dicon.sel{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.dicon.dragging{opacity:.75;z-index:5;pointer-events:none}
.dicon.drop{background:color-mix(in srgb,var(--accent) 35%,transparent);outline:2px solid var(--accent)}
.dicon .dname{max-width:84px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;text-align:center;word-break:break-word}
.band{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);pointer-events:none;z-index:4}
#wallimg{position:fixed;inset:0;background:#000 center/cover no-repeat}.pic.big{width:192px;height:108px}.picwall .dicon,.picwall .dicon *{color:#fff;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px rgba(0,0,0,.8)}
.picwall #wall{display:none}
.files li.drop{background:color-mix(in srgb,var(--accent) 25%,transparent)}
dl.props{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 10px;font-size:13px} dl.props dt{color:var(--muted)} dl.props dd{margin:0;overflow-wrap:anywhere;user-select:text}
/* Bin */
.binapp{display:flex;flex-direction:column;height:100%}
.binlist{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.binlist li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:default}
.binlist li:hover{background:var(--raised)} .binlist li.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.binlist .bn{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .binlist small{color:var(--muted)}
.binlist li.empty{display:block;color:var(--muted);text-align:center;padding:40px 10px}
/* Task Manager */
.tm{display:flex;flex-direction:column;height:100%;min-height:0}
.tmcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px 14px 8px}
.tmcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--raised);display:flex;flex-direction:column;gap:2px;min-width:0}
.tmcard b{font:700 22px var(--display);letter-spacing:.03em} .tmcard small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmcard .spark{margin-top:4px;height:28px} .tmcard .spark svg{width:100%;height:28px}
.tmtable{flex:1;overflow:auto;margin:0 14px;border:1px solid var(--line);border-radius:8px}
.tmrow{display:grid;grid-template-columns:1fr 90px 110px 90px;gap:8px;padding:7px 12px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);cursor:default}
.tmrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tmrow span:not(:first-child){text-align:right}
.tmrow:hover{background:var(--raised)} .tmrow.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.tmhead{position:sticky;top:0;background:var(--surface-solid);z-index:1;padding:0 12px}
.tmhead button{border:0;background:none;color:var(--muted);font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:9px 0;text-align:right;cursor:pointer}
.tmhead button:first-child{text-align:left} .tmhead button.on{color:var(--accent)}
.tm>.fileacts{padding:10px 14px}
/* pictures in Appearance */
.picrow{display:flex;gap:8px;flex-wrap:wrap} .pic{width:110px;height:68px;border-radius:6px;border:2px solid transparent;background:#000 center/cover no-repeat;cursor:pointer}
.pic.on{border-color:var(--accent)}

/* ===== 1.4.4: background apps (tray) ===== */
#trayp{display:none;flex-direction:column;gap:10px;padding:16px}
.view-popup #trayp.open{display:flex!important}
#trayg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#trayg .icon{color:var(--fg);text-shadow:none;padding:8px 2px} #trayg .icon:hover{background:var(--raised)} #trayg .glyph{width:40px;height:40px}
#trayg .glyph img{border-radius:6px} #trayg .dname{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.view-panel #rightbox{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px}
.view-panel #rightbox #tray{position:static;transform:none}
#trayArrow{width:34px;height:40px;color:var(--fg)} #trayArrow[hidden]{display:none}
#trayArrow::after{content:attr(data-n);position:absolute;top:4px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:var(--accent-fg);font:700 9px/14px var(--body);text-align:center;padding:0 3px}
</style>
</head>

let z=10, wins={}, nextPos=0;
function focus(id){for(const k in wins){wins[k].el.classList.toggle('blur',k!==id)}if(wins[id]){wins[id].el.style.zIndex=++z;wins[id].el.classList.remove('min')}active=id;renderBar()}

function openApp(key,arg){
  if(MW){closePanels();HX.openWindow(key,arg===undefined?null:arg).catch(e=>toast('Couldn’t open that',errMsg(e)));return}
  closePanels();
  const A=APPS[key];
  if(wins[key]&&!A.multi){focus(key);if(A.onArg&&arg)A.onArg(wins[key],arg);return}
  const id=A.multi?key+Date.now():key;
  const vw=innerWidth,vh=innerHeight-72;
  const w=Math.min(A.w||640,vw-24),hh=Math.min(A.h||440,vh-24);
  const off=(nextPos++%6)*28;
  const x=Math.max(12,Math.round((vw-w)/2-80+off)),y=Math.max(12,Math.round((vh-hh)/2-50+off));
  const body=h('div',{class:'body'});
  const title=h('div',{class:'t'},A.name);
  const el=h('div',{class:'win',style:`left:${x}px;top:${y}px;width:${w}px;height:${hh}px`,role:'dialog','aria-label':A.name},
    h('div',{class:'tbar'},glyph(key),title,h('div',{class:'ctl'},
      h('button',{title:'Minimise','aria-label':'Minimise',html:'<svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.3"/></svg>',on:{click:e=>{e.stopPropagation();minimise(id)}}}),
      h('button',{title:'Maximise','aria-label':'Maximise',html:'<svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',on:{click:e=>{e.stopPropagation();el.classList.toggle('max')}}}),
      h('button',{class:'x',title:'Close','aria-label':'Close',html:'<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>',on:{click:e=>{e.stopPropagation();close(id)}}}))),
    body,h('div',{class:'rs'}));
  el.addEventListener('pointerdown',()=>{if(active!==id)focus(id)});
  drag(el,$('.tbar',el));resize(el,$('.rs',el));
  $('.tbar',el).addEventListener('dblclick',e=>{if(!e.target.closest('.ctl'))el.classList.toggle('max')});
  document.body.append(el);
  wins[id]={el,key,title,body};
  const api={el,body,setTitle:t=>title.textContent=t,close:()=>close(id)};
  wins[id].api=api;
  A.mount(body,api,arg);
  focus(id);
}
function close(id){const w=wins[id];if(!w)return;w.api.onClose&&w.api.onClose();w.el.remove();delete wins[id];if(active===id)active=null;const rest=Object.keys(wins).filter(k=>!wins[k].el.classList.contains('min'));if(rest.length)focus(rest[rest.length-1]);else renderBar()}

function drag(el,handle){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.ctl')||innerWidth<=640)return;
    const r=el.getBoundingClientRect();
    if(el.classList.contains('max')){el.classList.remove('max');el.style.left=(e.clientX-r.width/2)+'px';}
    const sx=e.clientX-parseFloat(el.style.left),sy=e.clientY-parseFloat(el.style.top);
    handle.setPointerCapture(e.pointerId);document.body.classList.add('dragging');
    const mv=ev=>{el.style.left=Math.min(innerWidth-80,Math.max(-el.offsetWidth+80,ev.clientX-sx))+'px';el.style.top=Math.min(innerHeight-120,Math.max(0,ev.clientY-sy))+'px'};
    const up=ev=>{document.body.classList.remove('dragging');handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);if(ev.clientY<6)el.classList.add('max')};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);
  });
}
function resize(el,g){
  g.addEventListener('pointerdown',e=>{e.stopPropagation();const sw=el.offsetWidth,sh=el.offsetHeight,sx=e.clientX,sy=e.clientY;g.setPointerCapture(e.pointerId);document.body.classList.add('dragging');
    const mv=ev=>{el.style.width=Math.max(280,sw+ev.clientX-sx)+'px';el.style.height=Math.max(180,sh+ev.clientY-sy)+'px';el.dispatchEvent(new Event('winresize'))};
    const up=()=>{document.body.classList.remove('dragging');g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up)};
    g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up)});
}

/* ---------- a safe calculator (no eval) ---------- */
function calcEval(src){const s=src.replace(/\s+/g,'');let i=0;
  const peek=()=>s[i];const eat=c=>{if(s[i]===c){i++;return true}return false};
  function primary(){if(eat('(')){const v=expr();if(!eat(')'))throw new Error('bracket');return v}const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw new Error('number');i+=m[0].length;return parseFloat(m[0])}
  function factor(){if(eat('-'))return -factor();if(eat('+'))return factor();let v=primary();while(eat('%'))v/=100;return v}
  function term(){let v=factor();for(;;){if(eat('*'))v*=factor();else if(eat('/'))v/=factor();else return v}}
  function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v}}
  const v=expr();if(i!==s.length||!isFinite(v))throw new Error('bad');return +v.toPrecision(12)}

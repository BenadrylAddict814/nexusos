[Seat:*]
user-session=nexusos
autologin-session=nexusos
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
allow-guest=false
# 1.8: the Guest account starts fresh every time
session-setup-script=/usr/lib/nexusos/nexus-guest-cleanup
session-cleanup-script=/usr/lib/nexusos/nexus-guest-cleanup

# 1.8.4: only offer the NexusOS session, so the sign-in screen can't start bare Openbox by mistake
[LightDM]
sessions-directory=/usr/share/nexusos/xsessions

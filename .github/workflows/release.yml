# Publishes a signed NexusOS update whenever main has a VERSION that hasn't been released yet.
# (Bump VERSION, app/package.json and NOTES.md, push to main, and the release appears.)
name: Release NexusOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "$TAG is already released."; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check scripts and code
        if: steps.v.outputs.new == 'true'
        run: |
          for f in system/usr/bin/nexusos-session system/usr/lib/nexusos/nexus-* migrate.sh iso-kit/kit/build.sh; do
            if head -1 "$f" | grep -q python; then python3 -m py_compile "$f"; else bash -n "$f"; fi
          done
          node --check app/main.js && node --check app/preload.js
          test "$(python3 -c 'import json;print(json.load(open("app/package.json"))["version"])')" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build and sign the update
        if: steps.v.outputs.new == 'true'
        env:
          NEXUS_SIGNING_KEY: ${{ secrets.NEXUS_SIGNING_KEY }}
        run: |
          test -n "$NEXUS_SIGNING_KEY" || { echo "::error::The NEXUS_SIGNING_KEY secret is missing"; exit 1; }
          umask 077; printf '%s\n' "$NEXUS_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          tools/make-update.sh "$RUNNER_TEMP/key.pem"
          rm -f "$RUNNER_TEMP/key.pem"
          tools/make-kit.sh
      - name: Publish
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "NexusOS ${TAG#v}" --notes-file NOTES.md --latest \
            dist/manifest.json dist/manifest.json.sig dist/nexusos-update.tar.gz dist/NexusOS-ISO-Kit.zip
